<!DOCTYPE html>
<html>
    <head>
        <title>Tram Stop Space</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Tram Stop Space Prototype</h1>
        <p>This prototype represents a small tram stop space</p>

        <button id="bench-button">Show Bench</button>
        <button id="bin-button">Show Bin</button>

        <p id="bench-status">Bench is hidden.</p>
        <p id="bin-status">Bin is hidden.</p>
        
        <div id="bench" class="space-object">Bench object</div>
        <div id="bin" class="space-object">Bin object</div>
        <script src="script.js"></script>
    </body>
</html>
